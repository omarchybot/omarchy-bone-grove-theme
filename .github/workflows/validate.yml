name: Validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python3 -m unittest discover -s tests -v
      - name: Parse palette and shell tokens
        run: python3 -c "import tomllib; from pathlib import Path; [tomllib.loads(p.read_text()) for p in Path('.').glob('*.toml')]"
